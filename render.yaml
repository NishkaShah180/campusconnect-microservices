services:
  # 1. API Gateway (Public Web Service Entry Point)
  - type: web
    name: campusconnect-api-gateway
    env: docker
    dockerContext: api-gateway
    dockerfilePath: api-gateway/Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: 10000
      - key: USER_SERVICE_URL
        fromService:
          type: web
          name: campusconnect-user-service
          property: host
      - key: PRODUCT_SERVICE_URL
        fromService:
          type: web
          name: campusconnect-product-service
          property: host
      - key: ORDER_SERVICE_URL
        fromService:
          type: web
          name: campusconnect-order-service
          property: host

  # 2. User Service (Render Web Service - Free Tier Fallback)
  - type: web
    name: campusconnect-user-service
    env: docker
    dockerContext: user-service
    dockerfilePath: user-service/Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: MONGO_URI
        sync: false # Set in Render Dashboard with Atlas connection string: mongodb+srv://<user>:<password>@cluster.mongodb.net/user_db

  # 3. Product Service (Render Web Service - Free Tier Fallback)
  - type: web
    name: campusconnect-product-service
    env: docker
    dockerContext: product-service
    dockerfilePath: product-service/Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: MONGO_URI
        sync: false # Set in Render Dashboard with Atlas connection string: mongodb+srv://<user>:<password>@cluster.mongodb.net/product_db

  # 4. Order Service (Render Web Service - Free Tier Fallback)
  - type: web
    name: campusconnect-order-service
    env: docker
    dockerContext: order-service
    dockerfilePath: order-service/Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: MONGO_URI
        sync: false # Set in Render Dashboard with Atlas connection string: mongodb+srv://<user>:<password>@cluster.mongodb.net/order_db
      - key: USER_SERVICE_URL
        fromService:
          type: web
          name: campusconnect-user-service
          property: host
      - key: PRODUCT_SERVICE_URL
        fromService:
          type: web
          name: campusconnect-product-service
          property: host
