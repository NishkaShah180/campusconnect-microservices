services:
  # 1. API Gateway (Public Web Service)
  - type: web
    name: campusconnect-api-gateway
    env: docker
    dockerContext: ./api-gateway
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: 10000
      - key: USER_SERVICE_URL
        fromService:
          type: pserv
          name: campusconnect-user-service
          property: hostport
      - key: PRODUCT_SERVICE_URL
        fromService:
          type: pserv
          name: campusconnect-product-service
          property: hostport
      - key: ORDER_SERVICE_URL
        fromService:
          type: pserv
          name: campusconnect-order-service
          property: hostport

  # 2. User Service (Private Web Service)
  - type: pserv
    name: campusconnect-user-service
    env: docker
    dockerContext: ./user-service
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: MONGO_URI
        sync: false # Set in Render Dashboard with Atlas connection string: mongodb+srv://<user>:<password>@cluster.mongodb.net/user_db

  # 3. Product Service (Private Web Service)
  - type: pserv
    name: campusconnect-product-service
    env: docker
    dockerContext: ./product-service
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: MONGO_URI
        sync: false # Set in Render Dashboard with Atlas connection string: mongodb+srv://<user>:<password>@cluster.mongodb.net/product_db

  # 4. Order Service (Private Web Service)
  - type: pserv
    name: campusconnect-order-service
    env: docker
    dockerContext: ./order-service
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: MONGO_URI
        sync: false # Set in Render Dashboard with Atlas connection string: mongodb+srv://<user>:<password>@cluster.mongodb.net/order_db
      - key: USER_SERVICE_URL
        fromService:
          type: pserv
          name: campusconnect-user-service
          property: hostport
      - key: PRODUCT_SERVICE_URL
        fromService:
          type: pserv
          name: campusconnect-product-service
          property: hostport
